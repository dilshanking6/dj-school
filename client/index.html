<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="Digital Janta is the official web portal of Janta +2 High School, Khalari. Manage attendance, results, study material, events and school communication in one place."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Digital Janta | Janta +2 High School, Khalari</title>
    <script>
      // React load hone se pehle hi theme laga do, warna dark se light
      // switch karte waqt ek safed flash dikhta hai.
      (function () {
        try {
          var stored = localStorage.getItem('dj_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEF2F7');
          }
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <style>
      /* Boot splash.
         Render ka free plan 15 minute idle ke baad so jaata hai, phir next
         request par 30-60 second ka cold start lagta hai. Is dauraan JS load
         hota hai — pehle `#root` bilkul khaali tha, to user ko ek safed/
         kaala khali screen dikhti thi aur lagta tha ki site kharab hai.
         Ye splash turant dikhta hai aur React mount hone par hat jaata hai. */
      html { background: #0b1220; }
      html[data-theme='light'] { background: #eef2f7; }
      body { margin: 0; background: #0b1220; }
      html[data-theme='light'] body { background: #eef2f7; }
      #dj-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e2e8f0;
        z-index: 9999;
      }
      html[data-theme='light'] #dj-boot { color: #0f172a; }
      #dj-boot .ring {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #3b82f6;
        animation: dj-spin 0.8s linear infinite;
      }
      #dj-boot .name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
      #dj-boot .sub { font-size: 0.8rem; opacity: 0.65; }
      @keyframes dj-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #dj-boot .ring { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="dj-boot">
      <div class="ring" role="status" aria-label="Loading"></div>
      <div class="name">Digital Janta</div>
      <div class="sub" id="dj-boot-msg">Janta +2 High School, Khalari</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
